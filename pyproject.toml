[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-guardrail"
version = "1.0.0"
description = "A fine-tuned ML classification model that detects and blocks jailbreak attempts and prompt injection threats in LLM-based conversational systems."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Manikandan R", email = "rmanikandanrjsm@gmail.com" }]
requires-python = ">=3.9"
keywords = ["guardrails", "ml", "prompt", "safety", "llm", "jailbreak"]
dependencies = [
    "scikit-learn",
    "numpy",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardify = ["models/*.pkl"]
